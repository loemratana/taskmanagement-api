version: "3.9"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tms-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${SERVER_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # Readiness = app started and its database connection works.
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/management/health/readiness" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
#      redis:
#        condition: service_started

    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Inside Docker, reach other containers by service name, not localhost.
      DB_HOST: postgres
      DB_PORT: 5432

      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT:-9100}

      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

#      REDIS_HOST: ${REDIS_HOST}
#      REDIS_PORT: ${REDIS_PORT}

      JWT_SECRET: ${JWT_SECRET}
      # ":-" defaults: an unset variable would otherwise reach Spring as "" and fail to parse.
      JWT_EXPIRE: ${JWT_EXPIRE:-604800000}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-900000}

#  redis:
#    image: redis:8
#
#    container_name: tms-redis
#
#    restart: unless-stopped
#
#    command: redis-server --appendonly yes
#
#    ports:
#      - "6379:6379"
#
#    volumes:
#      - redis_data:/data
  postgres:
    image: postgres:17
    container_name: tms-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL","pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
  pgadmin:
    image: dpage/pgadmin4:9

    container_name: tms-pgadmin

    restart: unless-stopped

    env_file:
      - .env

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "5050:80"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - pgadmin_data:/var/lib/pgadmin
  minio:
    image: pgsty/minio:latest   # community build; minio/minio was removed from Docker Hub
    container_name: tms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${MINIO_API_PORT:-9100}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9101}:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  minio_data:

