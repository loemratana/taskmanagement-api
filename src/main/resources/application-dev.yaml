# Local development overrides.
# Convenience defaults are provided so the app can boot with minimal setup;
# override anything via .env / real environment variables as needed.

spring:
  datasource:
    # Same precedence as application.yaml: DB_USERNAME / DB_PASSWORD (e.g. Neon) win over the local POSTGRES_*.
    username: ${DB_USERNAME:${POSTGRES_USER:RATANA}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:admin123}}
  jpa:
    hibernate:
      # Same as prod: Flyway owns the schema. "update" could silently add columns in dev that
      # have no migration, which prod's "validate" would then reject. A missing migration now fails here first.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
        show_sql: true

app:
  jwt:
    # Dev-only fallback so a fresh checkout can boot without a .env file.
    # Never reuse this value outside local development.
    secret: ${JWT_SECRET:ZGV2LW9ubHktaW5zZWN1cmUtc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZC1lbnZzIQ==}

logging:
  level:
    root: info
    com.ratana.task_management_api: TRACE
    org.springframework.web: info
    org.springframework.security: info

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  show-actuator: true
