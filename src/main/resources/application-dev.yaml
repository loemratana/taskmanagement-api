# Local development overrides.
# Convenience defaults are provided so the app can boot with minimal setup;
# override anything via .env / real environment variables as needed.

spring:
  datasource:
    username: ${POSTGRES_USER:RATANA}
    password: ${POSTGRES_PASSWORD:admin123}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        # SQL output is controlled via logging.level.org.hibernate.SQL below (not show_sql, which bypasses the logger).
        show_sql: false

app:
  jwt:
    # Dev-only fallback so a fresh checkout can boot without a .env file.
    # Never reuse this value outside local development.
    secret: ${JWT_SECRET:ZGV2LW9ubHktaW5zZWN1cmUtc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZC1lbnZzIQ==}

cloudinary:
  # Shared dev/test account fallback — already exposed in prior source history,
  # treat as compromised and rotate before relying on it for anything real.
  cloud-name: ${CLOUDINARY_CLOUD_NAME:uwzbov1x}
  api-key: ${CLOUDINARY_API_KEY:272238923929533}
  api-secret: ${CLOUDINARY_API_SECRET:Rzka5aSYL201d2DPeSJmhWo7tzQ}

logging:
  level:
    root: info
    com.ratana.task_management_api: TRACE
    org.springframework.web: info
    org.springframework.security: info
    # Flip to debug to see SQL statements (add org.hibernate.orm.jdbc.bind: trace for bound parameters).
    org.hibernate.SQL: info

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  show-actuator: true
