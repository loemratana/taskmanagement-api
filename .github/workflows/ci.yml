name: CI/CD Pipeline

env:
  PROJECT_IMAGE_NAME: task-management-system-api


on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:

  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle


      - name: Make gradlew executable
        run: chmod +x gradlew


      - name: Build and test
        run: ./gradlew clean build --no-daemon


